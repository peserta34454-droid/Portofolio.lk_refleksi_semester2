<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Portofolio Digital LK 2 – Nurul Fajriah, S.Pd</title><link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><style id="css">
:root{--blue:#4a6cf7;--yellow:#ffd93b;--lime:#c3f55e;--navy:#1b2a8f;--card:#fff;--ink:#1a1f3a;--soft:#eef1ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1c2145;--ink:#eef0ff;--soft:#262c5c}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:60px}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--blue);color:var(--ink);padding-bottom:64px}
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px;font-size:12px;letter-spacing:.08em;color:#fff;background:var(--blue)}
section{padding:70px 20px 50px;max-width:1000px;margin:auto}
.wide{max-width:none;padding:0}.wrap{max-width:1000px;margin:auto;padding:70px 20px 50px}
h1,h2{font-family:Pacifico,cursive;font-weight:400;margin:0;line-height:1.1}
h1{font-size:clamp(46px,11vw,110px);color:var(--yellow);text-shadow:3px 3px 0 var(--navy)}
h2{font-size:clamp(36px,8vw,68px)}
.sub{font-family:Pacifico,cursive;font-size:clamp(16px,3vw,24px);margin:6px 0 22px}
#hero{background:linear-gradient(var(--blue) 55%,#6fb83a 55%);min-height:100vh;display:flex;flex-direction:column;justify-content:center}
#hero p{color:#fff;max-width:560px;font-size:15px;line-height:1.6}
.folders{display:flex;gap:18px;flex-wrap:wrap;margin-top:24px}
.folders a{color:#fff;text-decoration:none;font-size:12px;text-align:center;width:84px}
.folders a b{display:block;font-size:40px}
#about{background:var(--yellow);color:#1a1f3a}#about h2{color:var(--navy)}#about .sub{color:var(--navy)}
#about p{line-height:1.7;max-width:720px}
.pill{display:inline-block;border:2px solid var(--lime);background:var(--navy);color:#fff;border-radius:30px;padding:6px 16px;font-weight:800;font-size:12px;margin:3px 3px 0 0}
#ref{background:var(--lime);color:#1a1f3a}#ref h2{color:var(--blue)}#ref .sub{color:var(--navy)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tabs button{font:600 13px Inter,sans-serif;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:30px;padding:9px 16px;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.c{background:var(--card);color:var(--ink);border-radius:16px;padding:18px;border:2px solid var(--navy)}
.c h3{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.c p{margin:0;font-size:14px;line-height:1.65}
.art{margin-top:14px;background:var(--navy);color:#fff;border-radius:16px;padding:20px}
.art h3{margin:0 0 12px;font-family:Pacifico,cursive;font-weight:400;font-size:26px;color:var(--yellow)}
.art h4{margin:12px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--lime)}
.art p{margin:0;font-size:14px;line-height:1.65}
#end{background:#6fb83a;text-align:center;color:#fff}#end h2{color:var(--yellow);text-shadow:3px 3px 0 var(--navy)}
#end p{max-width:620px;margin:16px auto;line-height:1.7}
.bar{position:fixed;bottom:0;left:0;right:0;z-index:5;background:rgba(27,42,143,.92);display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bar a{color:#fff;text-decoration:none;font-size:12px;font-weight:600;border:1.5px solid #fff;border-radius:20px;padding:6px 12px}

.ph{position:relative}.ph img{width:100%;border-radius:16px;border:3px solid var(--navy);display:block;max-height:420px;object-fit:cover}
.ph button{position:absolute;top:8px;right:8px;border:0;border-radius:20px;background:#fff;color:#c00;font-weight:700;padding:5px 10px;cursor:pointer}
.add{display:flex;align-items:center;justify-content:center;min-height:110px;border:3px dashed var(--navy);border-radius:16px;font-weight:700;cursor:pointer;color:var(--navy);text-align:center;padding:10px;background:rgba(255,255,255,.6);font-size:13px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}.gal .ph img{max-height:200px}
.row{display:grid;grid-template-columns:1fr 240px;gap:24px;align-items:start}@media(max-width:700px){.row{grid-template-columns:1fr}}
.pb{margin-bottom:14px}
[contenteditable=true]{outline:2px dashed var(--yellow);outline-offset:3px;border-radius:6px;min-height:1em}
.fab{position:fixed;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.fab button{font:700 13px Inter,sans-serif;border:2px solid var(--navy);border-radius:30px;padding:10px 16px;background:var(--yellow);color:var(--navy);cursor:pointer;box-shadow:0 3px 0 var(--navy)}
.hint{background:var(--yellow);color:#1a1f3a;font-size:13px;padding:10px 14px;border-radius:12px;margin-bottom:16px;border:2px solid var(--navy)}
.lk{display:flex;gap:8px;align-items:center;margin:6px 0}.lk a{color:var(--yellow);font-weight:700;word-break:break-all}.lk button{border:0;border-radius:20px;background:#fff;color:#c00;font-weight:700;padding:4px 10px;cursor:pointer}.lkadd{display:grid;gap:8px;margin-top:10px}.lkadd input{padding:9px 12px;border-radius:10px;border:2px solid var(--lime);font:14px Inter,sans-serif}.lkadd button{border:0;border-radius:20px;background:var(--lime);color:var(--navy);font-weight:800;padding:9px;cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:130px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:9;display:none}

presentasi, serta aksi dan ekspresi agar semua murid dapat belajar.", "h": "Dulu saya memandang pembelajaran dan asesmen sebagai dua kegiatan terpisah, memakai asesmen awal hanya untuk tahu murid paham atau belum, dan merancang kegiatan yang sama untuk semua murid. Kini asesmen menjadi dasar keputusan pembelajaran, dan keberhasilan dilihat dari proses, bukan hanya nilai akhir.", "k": "Pembelajaran Mendalam (berkesadaran, bermakna, menggembirakan); pengalaman memahami–mengaplikasi–merefleksi; tiga prinsip DUP; asesmen awal kognitif dan nonkognitif; alur analisis hasil asesmen, keputusan, tindak lanjut, dan pemantauan perkembangan.", "p": "Melakukan asesmen awal sebelum mengajar; memakai hasilnya untuk memutuskan strategi dan dukungan; menghubungkan materi dengan kehidupan murid; menyediakan akses belajar yang beragam; dan merefleksikan strategi saya setelah mengajar.", "a": "Asesmen awal kognitif dan nonkognitif, analisis hasil dan rancangan tindak lanjut, RPM/RPPM berbasis DUP, LKPD/LKM, asesmen formatif, dan refleksi pembelajaran.", "b": "Artefak-artefak ini saling terhubung dan menunjukkan alur utuh: mengenali murid, merancang, melaksanakan, melakukan asesmen, hingga refleksi dan tindak lanjut.", "d": "Hasil asesmen awal dan analisis kebutuhan menunjukkan pembelajaran dimulai dari kondisi murid. Pada RPPM, tujuan pembelajaran, kegiatan memahami–mengaplikasi–merefleksi, prinsip berkesadaran-bermakna-menggembirakan, dan prinsip DUP menunjukkan rancangan berbasis kebutuhan murid; asesmen formatif menunjukkan asesmen dipakai selama proses.", "img": "", "art": [], "links": []}, {"n": "Technological Pedagogical Content Knowledge (TPACK)", "s": "TPACK", "c": "TPACK menegaskan bahwa guru tidak cukup menguasai materi, tetapi juga memahami karakteristik murid, memilih strategi yang sesuai, dan memanfaatkan teknologi secara tepat. Lingkungan dan kearifan lokal dapat menjadi sumber belajar, sejalan dengan pengalaman saya memakai budaya sekitar saat PPL.", "h": "Selama ini saya sudah memakai PPT, video, LCD, dan media digital, tetapi terutama agar pembelajaran menarik. Kini saya belajar bahwa teknologi harus disesuaikan dengan materi, tujuan, dan kebutuhan murid, serta bisa dipadukan dengan kearifan lokal.", "k": "Teknologi, pedagogi, dan materi harus saling mendukung; teknologi membantu murid memahami materi, bukan sekadar membuat menarik; pembelajaran disesuaikan dengan keberagaman murid; kearifan lokal sebagai konteks; guru sebagai fasilitator pengalaman belajar yang bermakna.", "p": "Mengaitkan pembelajaran dengan pengalaman nyata dan lingkungan murid, misalnya memakai permen sebagai benda konkret pada materi pembagian lalu melatih pemahaman dengan kuis digital; menggabungkan materi, metode, benda konkret, dan teknologi secara tepat.", "a": "LK 2 C: Kasus di SD Inpres Bumi Sagu.", "b": "Kasus ini sesuai dengan TPACK dan menunjukkan pentingnya menghubungkan materi dengan kehidupan nyata murid, termasuk kearifan lokal agar murid mengenal dan menghargai budayanya.", "d": "Solusi memakai daun kelor dan bunga bomba sebagai media konkret serta motif batik lokal Kota Palu sebagai konteks, dengan Canva dan sumber internet sebagai pendukung, menunjukkan teknologi dipakai untuk mendukung pembelajaran, bukan sekadar pelengkap.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/6xaJSlACEQAAAAEAABZ/anVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAFllqdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOmY2M2ViMWMwLTA0NGEtNDZiNS04ZWUwLWU0MzFmYmUzMDczNgAAAAOUanVtYgAAAClqdW1kYzJhcwARABCAAACqADibcQNjMnBhLmFzc2VydGlvbnMAAAAAuWp1bWIAAABEanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5pbmdyZWRpZW50LnYzAAAAABhjMnNomreAP+8Pm1vOXAoazpkEHwAAAG1jYm9yo2lkYzpmb3JtYXRqaW1hZ2UvanBlZ2ppbnN0YW5jZUlEeCx4bXA6aWlkOjQ1NTMwMzU1LTZlODktNDhhZC1iZWU2LWQ0MTdhMzc4Y2I2NmxyZWxhdGlvbnNoaXBocGFyZW50T2YAAAHianVtYgAAAEFqdW1kY2JvcgARABCAAACqADibcRNjMnBhLmFjdGlvbnMudjIAAAAAGGMyc2gXYyr3bp7DBUJJq9CnzJvAAAABmWNib3KiZ2FjdGlvbnOComZhY3Rpb25rYzJwYS5vcGVuZWRqcGFyYW1ldGVyc6FraW5ncmVkaWVudHOBomN1cm an, menghargai usaha, dan tidak mempermalukan kesalahan. Program ini mengingatkan bahwa nilai sosial emosional kuat bila murid melihat teladannya pada guru.", "d": "Tongkat Keberanian memberi ruang murid berbicara tanpa takut ditertawakan dan melatih saya mendengarkan penuh perhatian, tidak memotong, dan tidak langsung menghakimi, sejalan dengan empati dan mindfulness dalam EMC².", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/6xaJSlACEQAAAAEAABZ/anVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAFllqdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOjRjOTE3NjI3LTM3YTgtNGJlMy1hYTM1LWFmMjE3MmU3Mzg0NwAAAAOUanVtYgAAAClqdW1kYzJhcwARABCAAACqADibcQNjMnBhLmFzc2VydGlvbnMAAAAAuWp1bWIAAABEanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5pbmdyZWRpZW50LnYzAAAAABhjMnNonONx5RHKWDZ81EMGjpoZoAAAAG1jYm9yo2lkYzpmb3JtYXRqaW1hZ2UvanBlZ2ppbnN0YW5jZUlEeCx4bXA6aWlkOmMwYTRmYWFmLTI1OTYtNDQyNS1hN2Y5LTBhYzhkMzEyMjYyNGxyZWxhdGlvbnNoaXBocGFyZW50T2YAAAHianVtYgAAAEFqdW1kY2JvcgARABCAAACqADibcRNjMnBhLmFjdGlvbnMudjIAAAAAGGMyc2iXHvNzllU0Lbq98VuOBZxjAAABmWNib3KiZ2FjdGlvbnOComZhY3Rpb25rYzJwYS5vcGVuZWRqcGFyYW1ldGVyc6FraW5ncmVkaWVudHOBomN1cmx4LXNlbGYjanVtYmY9YzJwYS5hc3NlcnRpb25zL2MycGEuaW5ncmVkaWVudC52M2RoYXNoWCBTjp6ngwCnjAqlSuF1F3lMj1v2UB4Gr7ZOpUK0O4KKP6RmYWN0aW9ueB1jb20uYW50aHJvcGljLmNsYXVkZS5wcm92aWRlZGpwYXJhbWV0ZXJzoXgfY29tLmFudGhyb3BpYy5vcmlnaW4tY29uZmlkZW5jZWd1bmtub3dua2Rlc2NyaXB0aW9ueGZDbGF1ZGUgcHJvdmlkZWQgdGhpcyBmaWxlIGF0IHRoZSByZXF1ZXN0IG9mIGEgdXNlciBhbmQgbWF5IGhhdmUgY3JlYXRlZCBvciBtb2RpZmllZCB0aGUgZmlsZSBjb250ZW50cy5tc29mdHdhcmVBZ2VudKFkbmFtZWZDbGF1ZGVyYWxsQWN0aW9uc0luY2x1ZGVk9QAAAMhqdW1iAAAAQGp1bWRjYm9yABEAEIAAAKoAOJtxE2MycGEuaGFzaC5kYXRhAAAAABhjMnNoeqHNPy8Wth+3uawUErVgFwAAAIBjYm9ypWNhbGdmc2hhMjU2Y3BhZE4AAAAAAAAAAAAAAAAAAGRoYXNoWCBcwqopBFHYf7pVCDXR4MybdRIjBxgk/CBm3xjBjksynWRuYW1lbmp1bWJmIG1hbmlmZXN0amV4Y2x1c2lvbnOBomVzdGFydBRmbGVuZ3RoGRaLAAACPmp1bWIAAAAnanVtZGMyY2wAEQAQgAAAqgA4m3EDYzJwYS5jbGFpbS52MgAAAAIPY2JvcqVjYWxnZnNoYTI1NmlzaWduYXR1cmV4TXNlbGYjanVtYmY9L2MycGEvdXJuOmMycGE6NGM5MTc2MjctMzdhOC00YmUz ; menyusun tujuan terukur dengan indikator evaluasi; dan lebih terbuka bekerja sama dengan guru, orang tua, dan masyarakat.", "a": "Proposal Projek Kepemimpinan Tim Lentera Kaili (Kelompok 3, PPG Universitas Tadulako Gelombang 1 Tahun 2026), didukung artefak Tugas 1.1, 2.1, 4.1, 5.1, dan 6.1.", "b": "Proposal ini menyatukan seluruh pembelajaran Topik 1–2 menjadi rencana nyata dan menunjukkan perubahan cara berpikir saya: dari mengajar materi menjadi merancang pembelajaran dari kebutuhan anak, budaya lokal, dan kerja tim.", "d": "Bab I (latar belakang dari survei di Taman Baca Tata Vuri) membuktikan solusi berangkat dari kebutuhan nyata; tujuan, luaran, dan struktur kerja menunjukkan perencanaan terukur; Bab II (program belajar sambil bermain berbasis potensi lokal) menunjukkan penerapan; Bab III (anggaran) menunjukkan tanggung jawab atas sumber daya.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/6xaJSlACEQAAAAEAABZ/anVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAFllqdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOmEwNDMzMzZjLTgwODctNGZkOC1hMDdmLTMwMzZlNTNjZDE0OAAAAAOUanVtYgAAAClqdW1kYzJhcwARABCAAACqADibcQNjMnBhLmFzc2VydGlvbnMAAAAAuWp1bWIAAABEanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5pbmdyZWRpZW50LnYzAAAAABhjMnNojEyIuCdbEOisroFxPseAGwAAAG1jYm9yo2lkYzpmb3JtYXRqaW1hZ2UvanBlZ2ppbnN0YW5jZUlEeCx4bXA6aWlkOmFhODI3YWFjLTllZDctNDVmMy05NWE1LTFkYWUwYjQwMjRkYmxyZWxhdGlvbnNoaXBocGFyZW50T2YAAAHianVtYgAAAEFqdW1kY2JvcgARABCAAACqADibcRNjMnBhLmFjdGlvbnMudjIAAAAAGGMyc2i65uec7tAWJ1yDe0XlighTAAABmWNib3KiZ2FjdGlvbnOComZhY3Rpb25rYzJwYS5vcGVuZWRqcGFyYW1ldGVyc6FraW5ncmVkaWVudHOBomN1cmx4LXNlbGYjanVtYmY9YzJwYS5hc3NlcnRpb25zL2MycGEuaW5ncmVkaWVudC52M2RoYXNoWCBNdmAwDpWBzaZgdc5fb8Uu14VAD6SA407i66XzA5tru6RmYWN0aW9ueB1jb20uYW50aHJvcGljLmNsYXVkZS5wcm92aWRlZGpwYXJhbWV0ZXJzoXgfY29tLmFudGhyb3BpYy5vcmlnaW4tY29uZmlkZW5jZWd1bmtub3dua2Rlc2NyaXB0aW9ueGZDbGF1ZGUgcHJvdmlkZWQgdGhpcyBmaWxlIGF0IHRoZSByZXF1ZXN0IG9mIGEgdXNlciBhbmQgbWF5IGhhdmUgY3JlYXRlZCBvciBtb2RpZmllZCB0aGUgZmlsZSBjb250ZW50cy5tc29mdHdhcmVB ing-masing 3 pertemuan.", "h": "Kesepakatan kelas dan instruksi lisan belum bisa diterapkan sempurna di kelas 3. Saya memilih memberi tugas tertulis di LKM agar murid duduk diam, yang membuat belajar kurang menyenangkan dan menurunkan antusiasme serta hasil belajar.", "k": "Kesepakatan kelas tertulis tidak cukup menarik perhatian murid kelas 3; tugas duduk diam mengatasi kegaduhan tetapi menurunkan keterlibatan; energi aktif murid dapat difasilitasi menjadi partisipasi aktif dalam belajar.", "p": "Merancang pembelajaran sesuai karakter murid kelas 3 yang aktif dan menyukai tantangan: RPPM Matematika Waktu dan Durasi dengan permainan edukatif berupa tantangan dan Lembar Reward Bintang yang menghargai sikap fokus, berani, kompak, bertanggung jawab, dan sportif.", "a": "RPPM (Rencana Pelaksanaan Pembelajaran Mendalam) Siklus 2, Matematika materi Waktu dan Durasi, kelas III.", "b": "Artefak ini menunjukkan perubahan nyata: tantangan disesuaikan dengan karakter murid kelas 3, LKM sebagai bentuk tugas, dan Lembar Reward Bintang sebagai apresiasi atas sikap, bukan hanya jawaban.", "d": "Model Game-Based Learning dengan Tantangan 1, 2, 3 hingga tantangan akhir (mengamati jam, menjawab, mengerjakan LKM, berdiskusi, bekerja sama) dan Lembar Reward Bintang menunjukkan energi aktif murid diarahkan menjadi partisipasi positif; murid lebih menyimak dan lebih memperhatikan kesepakatan kelas.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/6xaJSlACEQAAAAEAABZ/anVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAFllqdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOjZkYjRmZGE5LWRkNGItNDY0Mi04YTYxLTNkMWQ4M2E4MGEwNQAAAAOUanVtYgAAAClqdW1kYzJhcwARABCAAACqADibcQNjMnBhLmFzc2VydGlvbnMAAAAAuWp1bWIAAABEanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5pbmdyZWRpZW50LnYzAAAAABhjMnNoiWGkYvAXp7paClvrheqWjQAAAG1jYm9yo2lkYzpmb3JtYXRqaW1hZ2UvanBlZ2ppbnN0YW5jZUlEeCx4bXA6aWlkOjdkZDA5MTdlLThhNjEtNDRmOS05MGU5LWY0OWYxOTgzZDgzZWxyZWxhdGlvbnNoaXBocGFyZW50T2YAAAHianVtYgAAAEFqdW1kY2JvcgARABCAAACqADibcRNjMnBhLmFjdGl
